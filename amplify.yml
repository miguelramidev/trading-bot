version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            # Instalar Flutter via git clone (sin dependencias de sistema)
            - git clone https://github.com/flutter/flutter.git -b stable --depth 1
            - export PATH="$PATH:`pwd`/flutter/bin"
            - flutter --version
            - flutter config --enable-web
            - flutter pub get
        build:
          commands:
            - export PATH="$PATH:`pwd`/flutter/bin"
            - flutter build web --release --base-href /
      artifacts:
        baseDirectory: build/web
        files:
          - '**/*'
      cache:
        paths:
          - flutter/bin/cache/**/*
          - .pub-cache/**/*
    appRoot: app

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ingreso — escritorio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0E1116}
a{color:#8CC2FF}a:hover{color:#B8D9FF}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0E1116; color: #E6EAF0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; box-sizing: border-box; position: relative">

<main style="width: 420px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<div style="width: 56px; height: 56px; border-radius: 16px; background: #1B222B; border: 1px solid #262E39; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 20px; color: {{accent}}">MQ</div>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">MacroQuant</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #9AA4B2">Tus señales, tus posiciones y tu historial de Binance Futures en un solo lugar.</p>
</div>

<sc-if value="{{isStart}}" hint-placeholder-val="{{ true }}">
<section aria-label="Ingresar" style="background: #151A21; border: 1px solid #262E39; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
<button style="height: 50px; border-radius: 12px; border: none; background: #F1F3F6; color: #0B1220; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px">
<span style="width: 20px; height: 20px; border-radius: 4px; border: 1.5px dashed #7A8594; box-sizing: border-box"></span>Continuar con Google</button>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #9AA4B2; text-align: center">El acceso está limitado a cuentas autorizadas.</p>
</section>
</sc-if>

<sc-if value="{{isDenied}}" hint-placeholder-val="{{ false }}">
<section aria-label="Cuenta sin acceso" style="background: #151A21; border: 1px solid #262E39; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 12px; padding: 14px; border-radius: 10px; background: rgba(242, 180, 65, 0.1); color: #F2B441; font-size: 14px; line-height: 1.5">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<span>La cuenta miguel@ejemplo.com no tiene acceso a esta app.</span>
</div>
<button style="height: 50px; border-radius: 12px; border: 1px solid #262E39; background: transparent; color: #E6EAF0; font-family: inherit; font-size: 15px; font-weight: 600">Usar otra cuenta de Google</button>
</section>
</sc-if>
</main>

<footer style="position: absolute; bottom: 28px; left: 0; right: 0; text-align: center; font-size: 12px; color: #7A8594">MacroQuant · versión [X.Y]</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"estado":{"editor":"enum","options":["inicio","sin acceso"],"default":"inicio"},"accent":{"editor":"color","default":"#4C9AFF","options":["#4C9AFF","#7AA2F7","#3FD089"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const estado = this.props.estado ?? 'inicio';
    return {
      accent: this.props.accent ?? '#4C9AFF',
      isStart: estado === 'inicio',
      isDenied: estado === 'sin acceso'
    };
  }
}
</script>
</body>
</html>

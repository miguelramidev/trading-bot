<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Historial — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0E1116}
a{color:#8CC2FF}a:hover{color:#B8D9FF}
</style>
</helmet>
<div style="width: 390px; height: 1500px; display: flex; flex-direction: column; background: #0E1116; color: #E6EAF0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; box-sizing: border-box">

<header style="height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #1E252E">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">Historial</h1>
<button style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #262E39; background: #151A21; color: #E6EAF0; font-family: inherit; font-size: 13px">30 días</button>
</header>

<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 16px; box-sizing: border-box">

<section aria-label="Resumen" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: #151A21; border: 1px solid #262E39; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #9AA4B2">PnL neto</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; color: #FF8A80">−$0.32</span>
<span style="font-size: 11px; color: #9AA4B2">con comisiones</span>
</div>
<div style="background: #151A21; border: 1px solid #262E39; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #9AA4B2">Aciertos</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600">31.3%</span>
<span style="font-size: 11px; color: #9AA4B2">15 de 48</span>
</div>
<div style="background: #151A21; border: 1px solid #262E39; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #9AA4B2">Profit factor</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; color: #F2B441">0.98</span>
<span style="font-size: 11px; color: #9AA4B2">menor a 1: pierde</span>
</div>
<div style="background: #151A21; border: 1px solid #262E39; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #9AA4B2">Cerradas</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600">48</span>
<span style="font-size: 11px; color: #9AA4B2">de 181 señales</span>
</div>
</section>

<div role="group" aria-label="Filtro por tipo" style="display: flex; gap: 8px">
<button style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #3A4553; background: #1B222B; color: #E6EAF0; font-family: inherit; font-size: 14px; font-weight: 600">Todas</button>
<button style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #262E39; background: transparent; color: #9AA4B2; font-family: inherit; font-size: 14px">Ejecutadas</button>
<button style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #262E39; background: transparent; color: #9AA4B2; font-family: inherit; font-size: 14px">Descartadas</button>
</div>

<section aria-label="Operaciones" style="background: #151A21; border: 1px solid #262E39; border-radius: 16px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<a href="PositionMobile.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #1E252E; color: #E6EAF0; text-decoration: none">
<span style="display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; align-items: center; gap: 8px"><span style="font-weight: 600; font-size: 15px">{{r.sym}}</span><span style="font-size: 12px; font-weight: 600; color: {{r.dirColor}}">{{r.dir}}</span></span>
<span style="font-size: 12px; color: #9AA4B2">{{r.time}} · {{r.strat}}</span>
</span>
<span style="display: flex; flex-direction: column; gap: 4px; align-items: flex-end">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: {{r.resColor}}">{{r.pnl}}</span>
<span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; color: {{r.stColor}}; background: {{r.stBg}}">{{r.status}}</span>
</span>
</a>
</sc-for>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: 13px; color: #9AA4B2">
<button aria-label="Página anterior" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #262E39; background: transparent; color: #7A8594; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<span>1–8 de 181</span>
<button aria-label="Página siguiente" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #262E39; background: transparent; color: #E6EAF0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</section>

</main>

<nav aria-label="Navegación principal" style="height: 72px; flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #1E252E; background: #11151B">
<a href="Mobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA4B2; text-decoration: none; font-size: 12px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Inicio</a>
<a href="HistoryMobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #E6EAF0; text-decoration: none; font-size: 12px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>Historial</a>
<a href="SettingsMobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA4B2; text-decoration: none; font-size: 12px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h4"></path><path d="M12 17h8"></path><circle cx="10" cy="17" r="2"></circle></svg>Ajustes</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const L = '#3FD089', S = '#FF8A80';
    const tp = { stColor: '#3FD089', stBg: 'rgba(63, 208, 137, 0.12)', resColor: '#3FD089' };
    const sl = { stColor: '#FF8A80', stBg: 'rgba(255, 107, 97, 0.12)', resColor: '#FF8A80' };
    const off = { stColor: '#9AA4B2', stBg: '#1B222B', resColor: '#7A8594' };
    return {
      rows: [
        { time: '22:31', sym: 'MOVR', dir: 'LONG', dirColor: L, strat: 'Tendencial', status: 'Descartada', ...off, pnl: '—' },
        { time: '22:31', sym: 'CELO', dir: 'LONG', dirColor: L, strat: 'Tendencial', status: 'Stop', ...sl, pnl: '−$0.07' },
        { time: '22:16', sym: 'SKY', dir: 'LONG', dirColor: L, strat: 'Tendencial', status: 'Descartada', ...off, pnl: '—' },
        { time: '21:15', sym: 'LINK', dir: 'SHORT', dirColor: S, strat: 'Tendencial', status: 'Stop', ...sl, pnl: '−$0.30' },
        { time: '21:01', sym: '龙虾', dir: 'SHORT', dirColor: S, strat: 'Tendencial', status: 'Objetivo', ...tp, pnl: '+$0.50' },
        { time: '19:31', sym: 'OP', dir: 'SHORT', dirColor: S, strat: 'Tendencial', status: 'Stop', ...sl, pnl: '−$0.40' },
        { time: '19:31', sym: 'LTC', dir: 'LONG', dirColor: L, strat: 'Macro Breakout', status: 'Stop', ...sl, pnl: '−$0.05' },
        { time: '15:45', sym: 'ETH', dir: 'LONG', dirColor: L, strat: 'Tendencial', status: 'Stop', ...sl, pnl: '−$0.18' }
      ]
    };
  }
}
</script>
</body>
</html>
